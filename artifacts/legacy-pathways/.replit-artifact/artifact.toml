kind = "web"
previewPath = "/"
title = "Legacy Pathways"
version = "1.0.0"
id = "artifacts/legacy-pathways"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22105

[services.development]
run = "pnpm --filter @workspace/legacy-pathways run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/legacy-pathways", "run", "build" ]
publicDir = "artifacts/legacy-pathways/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22105"
BASE_PATH = "/"
